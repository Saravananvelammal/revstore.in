<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >
  <meta name="robots" content="noindex,nofollow">

  <title>Opening RevStore…</title>
</head>

<body>

<p>Opening RevStore…</p>

<script>
(function () {
  "use strict";

  const match =
    window.location.pathname.match(
      /^\/r\/([A-Za-z0-9_-]{10,16})\/?$/
    );

  if (!match) {
    window.location.replace("/");
    return;
  }

  const referralCode =
    match[1];

  const backendUrl =
    "https://api.revstore.in" +
    "/api/customer/v1/referral/open/" +
    encodeURIComponent(referralCode);

  window.location.replace(
    backendUrl
  );
})();
</script>

<noscript>
  <p>
    JavaScript is required to open this referral link.
  </p>
</noscript>

</body>
</html>
