<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="robots"
        content="noindex,nofollow"
    >

    <title>RevStore Referral</title>
</head>

<body>

<p>Opening RevStore…</p>

<script>
(function () {
    "use strict";

    /*
     * Normally referral links use:
     *
     * /r/REFERRAL_CODE
     *
     * GitHub Pages sends that missing static path to
     * the repository-root 404.html.
     *
     * This /r/index.html remains only as a safe
     * fallback for /r/ itself.
     */

    const params =
        new URLSearchParams(
            window.location.search
        );

    const referralCode =
        (
            params.get("rev_ref") ||
            ""
        ).trim();

    const referralPattern =
        /^[A-Za-z0-9_-]{10,16}$/;

    if (
        !referralPattern.test(
            referralCode
        )
    ) {
        window.location.replace("/");
        return;
    }

    const backendUrl =
        "https://api.revstore.in" +
        "/api/customer/v1/referral/open/" +
        encodeURIComponent(
            referralCode
        );

    window.location.replace(
        backendUrl
    );
})();
</script>

<noscript>
    <p>
        JavaScript is required to open this RevStore referral link.
    </p>
</noscript>

</body>
</html>
