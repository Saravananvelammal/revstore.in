<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Revstore Careers Admin</title>
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet" />
  <style>
    :root {
      --bg1:#4318b8; --bg2:#7e22ce; --bg3:#c026d3;
      --card:rgba(255,255,255,.96); --text:#1e1b4b; --muted:#6b7280;
      --line:rgba(30,27,75,.12); --primary:#5b21b6; --danger:#dc2626;
      --success:#059669; --warn:#d97706;
      --shadow:0 18px 60px rgba(49,12,120,.25); --radius:24px;
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; padding:22px;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--text);
      background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));
    }
    .app{max-width:1200px;margin:0 auto;display:grid;gap:18px}
    .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;color:#fff}
    h1{margin:0;font-size:2rem;font-weight:900}
    .sub{margin:8px 0 0;color:rgba(255,255,255,.86)}
    .actions{display:flex;gap:10px;flex-wrap:wrap}
    .btn{
      min-height:44px;padding:0 16px;border-radius:14px;border:1px solid var(--line);
      cursor:pointer;font-weight:850;background:#fff;color:var(--text)
    }
    .btn-primary{border:0;color:#fff;background:linear-gradient(135deg,#5b21b6,#7c3aed,#a21caf)}
    .btn-danger{border:0;color:#fff;background:linear-gradient(135deg,#dc2626,#b91c1c)}
    .btn:disabled{opacity:.6;cursor:not-allowed}
    .panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
    .toolbar{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:12px;margin-bottom:16px}
    input,select,textarea{
      width:100%;border:1px solid var(--line);border-radius:14px;padding:0 14px;
      min-height:44px;font:inherit;background:#fff;color:var(--text)
    }
    textarea{padding:12px 14px;min-height:90px;resize:vertical}
    .banner{display:none;padding:14px 16px;border-radius:16px;margin-bottom:14px}
    .banner.show{display:block}
    .banner.error{background:rgba(239,68,68,.12);color:#7f1d1d}
    .banner.success{background:rgba(16,185,129,.12);color:#065f46}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:18px;background:#fff}
    table{width:100%;border-collapse:collapse;min-width:950px}
    th,td{padding:14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
    th{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:#fafafa}
    tr:hover{background:#faf7ff}
    .badge{display:inline-flex;border-radius:999px;padding:6px 10px;font-weight:900;font-size:.78rem}
    .processing{background:#eef2ff;color:#3730a3}
    .shortlisted{background:#ecfdf5;color:#065f46}
    .interview_scheduled{background:#fff7ed;color:#9a3412}
    .hired{background:#dcfce7;color:#166534}
    .better_luck_next_time{background:#fee2e2;color:#991b1b}
    .muted{color:var(--muted)}
    .pagination{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.48);display:none;place-items:center;padding:18px;z-index:20}
    .modal.show{display:grid}
    .modal-card{width:100%;max-width:760px;max-height:90vh;overflow:auto;background:#fff;border-radius:22px;padding:22px;box-shadow:var(--shadow)}
    .modal-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}
    .modal-head h2{margin:0}
    .details{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
    .detail{border:1px solid var(--line);border-radius:16px;padding:12px;background:#fafafa}
    .detail strong{display:block;font-size:.78rem;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
    .resume-frame{width:100%;height:520px;border:1px solid var(--line);border-radius:16px;background:#f9fafb}
    .status-box{display:grid;gap:12px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
    .empty{text-align:center;padding:30px;color:var(--muted)}
    @media(max-width:850px){
      .topbar{flex-direction:column}
      .toolbar{grid-template-columns:1fr}
      .details{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div>
      <h1>Career Applications</h1>
      <p class="sub">Fetch candidates, view resumes, and update hiring status.</p>
    </div>
    <div class="actions">
      <button class="btn" onclick="location.href='./dashboard.html'">Dashboard</button>
      <button id="refreshBtn" class="btn btn-primary">Refresh</button>
    </div>
  </header>

  <section class="panel">
    <div id="banner" class="banner"></div>

    <div class="toolbar">
      <input id="searchInput" placeholder="Search name, mobile, tracking ID, city..." />
      <select id="statusFilter">
        <option value="">All Status</option>
        <option value="processing">Processing</option>
        <option value="shortlisted">Shortlisted</option>
        <option value="interview_scheduled">Interview Scheduled</option>
        <option value="hired">Hired</option>
        <option value="better_luck_next_time">Better Luck Next Time</option>
      </select>
      <input id="designationFilter" placeholder="Designation filter" />
      <button id="applyFilterBtn" class="btn btn-primary">Apply</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
        <tr>
          <th>Candidate</th>
          <th>Mobile</th>
          <th>Designation</th>
          <th>Location</th>
          <th>Status</th>
          <th>Submitted</th>
          <th>Action</th>
        </tr>
        </thead>
        <tbody id="tbody">
        <tr><td colspan="7" class="empty">Loading applications...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="pagination">
      <button id="prevBtn" class="btn">Previous</button>
      <div id="pageInfo" class="muted">Page 1</div>
      <button id="nextBtn" class="btn">Next</button>
    </div>
  </section>
</main>

<div id="candidateModal" class="modal">
  <div class="modal-card">
    <div class="modal-head">
      <div>
        <h2 id="modalTitle">Candidate Details</h2>
        <p id="modalSub" class="muted"></p>
      </div>
      <button id="closeModalBtn" class="btn">Close</button>
    </div>

    <div id="candidateDetails" class="details"></div>

    <div class="actions">
      <a id="resumeOpenBtn" class="btn btn-primary" href="#" target="_blank" rel="noopener">Open Resume</a>
    </div>

    <div style="margin-top:14px">
      <iframe id="resumeFrame" class="resume-frame" title="Resume Preview"></iframe>
    </div>

    <div class="status-box">
      <label><strong>Update Status</strong></label>
      <select id="newStatus">
        <option value="processing">Processing</option>
        <option value="shortlisted">Shortlisted</option>
        <option value="interview_scheduled">Interview Scheduled</option>
        <option value="hired">Hired</option>
        <option value="better_luck_next_time">Better Luck Next Time</option>
      </select>

      <textarea id="adminNote" placeholder="Admin note, interview date, rejection reason, etc."></textarea>

      <button id="updateStatusBtn" class="btn btn-primary">Update Status</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  const CONFIG = {
    API_BASE: typeof window.ADMIN_WEB_API_BASE === 'string' && window.ADMIN_WEB_API_BASE.trim()
      ? window.ADMIN_WEB_API_BASE.trim().replace(/\/+$/, '')
      : 'https://api.revstore.in/api/admin-web/v1',
    LOGIN_URL: typeof window.ADMIN_WEB_LOGIN_URL === 'string' && window.ADMIN_WEB_LOGIN_URL.trim()
      ? window.ADMIN_WEB_LOGIN_URL.trim()
      : '/admin/login',
    FINGERPRINT_STORAGE_KEY: 'admin_web_fp_v1'
  };

  const ALLOWED_STATUS = new Set([
    'processing',
    'shortlisted',
    'interview_scheduled',
    'hired',
    'better_luck_next_time'
  ]);

  const els = {
    banner: document.getElementById('banner'),
    tbody: document.getElementById('tbody'),
    searchInput: document.getElementById('searchInput'),
    statusFilter: document.getElementById('statusFilter'),
    designationFilter: document.getElementById('designationFilter'),
    applyFilterBtn: document.getElementById('applyFilterBtn'),
    refreshBtn: document.getElementById('refreshBtn'),
    prevBtn: document.getElementById('prevBtn'),
    nextBtn: document.getElementById('nextBtn'),
    pageInfo: document.getElementById('pageInfo'),
    modal: document.getElementById('candidateModal'),
    closeModalBtn: document.getElementById('closeModalBtn'),
    modalTitle: document.getElementById('modalTitle'),
    modalSub: document.getElementById('modalSub'),
    candidateDetails: document.getElementById('candidateDetails'),
    resumeOpenBtn: document.getElementById('resumeOpenBtn'),
    resumeFrame: document.getElementById('resumeFrame'),
    newStatus: document.getElementById('newStatus'),
    adminNote: document.getElementById('adminNote'),
    updateStatusBtn: document.getElementById('updateStatusBtn')
  };

  const state = {
    fingerprint: '',
    page: 1,
    limit: 20,
    pages: 1,
    total: 0,
    items: [],
    selected: null,
    busy: false
  };

  let currentResumeBlobUrl = "";

  async function loadResumeBlob(id) {
    if (currentResumeBlobUrl) {
      URL.revokeObjectURL(currentResumeBlobUrl);
      currentResumeBlobUrl = "";
    }

    const headers = new Headers();
    headers.set("Accept", "application/pdf");
    headers.set("X-Requested-With", "XMLHttpRequest");
    if (state.fingerprint) {
      headers.set("x-device-fingerprint", state.fingerprint);
    }

    const res = await fetch(
      CONFIG.API_BASE + "/careers/" + encodeURIComponent(id) + "/resume",
      {
        method: "GET",
        headers,
        credentials: "include",
        cache: "no-store"
      }
    );

    if (!res.ok) {
      throw new Error("Failed to load resume");
    }

    const blob = await res.blob();
    currentResumeBlobUrl = URL.createObjectURL(blob);
    return currentResumeBlobUrl;
  }

  function escapeHtml(value) {
    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function getCookie(name) {
    const target = String(name || '') + '=';
    return String(document.cookie || '')
      .split(';')
      .map(v => v.trim())
      .find(v => v.indexOf(target) === 0)
      ?.slice(target.length) || '';
  }

  async function sha256Hex(input) {
    const data = new TextEncoder().encode(String(input));
    const digest = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(digest))
      .map(b => b.toString(16).padStart(2, '0'))
      .join('');
  }

  async function getStableFingerprint() {
    try {
      const existing = localStorage.getItem(CONFIG.FINGERPRINT_STORAGE_KEY);
      if (existing) return existing.slice(0, 200);
    } catch (_) {}

    const raw = [
      navigator.userAgent,
      navigator.language,
      screen.width,
      screen.height,
      screen.colorDepth,
      Intl.DateTimeFormat().resolvedOptions().timeZone,
      navigator.platform,
      crypto.getRandomValues(new Uint32Array(4)).join('-')
    ].join('|');

    const fp = (await sha256Hex(raw)).slice(0, 64);
    try { localStorage.setItem(CONFIG.FINGERPRINT_STORAGE_KEY, fp); } catch (_) {}
    return fp;
  }

  function showBanner(type, message) {
    els.banner.className = 'banner show ' + type;
    els.banner.textContent = message || '';
  }

  function clearBanner() {
    els.banner.className = 'banner';
    els.banner.textContent = '';
  }

  function redirectToLogin() {
    window.location.replace(CONFIG.LOGIN_URL);
  }

  async function apiFetch(path, options) {
    const headers = new Headers(options?.headers || {});
    headers.set('Accept', 'application/json');
    headers.set('X-Requested-With', 'XMLHttpRequest');
    if (state.fingerprint) headers.set('x-device-fingerprint', state.fingerprint);

    const res = await fetch(CONFIG.API_BASE + path, {
      ...(options || {}),
      headers,
      credentials: 'include',
      cache: 'no-store',
      redirect: 'follow',
      referrerPolicy: 'strict-origin-when-cross-origin'
    });

    let data = {};
    try { data = await res.json(); } catch (_) {}

    if (res.status === 401 || res.status === 403) {
      throw Object.assign(new Error(data.message || 'Session expired.'), { status: res.status });
    }

    if (!res.ok) {
      throw Object.assign(new Error(data.message || 'Request failed.'), { status: res.status });
    }

    return data;
  }

  function formatDate(value) {
    if (!value) return '-';
    const d = new Date(value);
    if (Number.isNaN(d.getTime())) return '-';
    return d.toLocaleString('en-IN', {
      day:'2-digit',
      month:'short',
      year:'numeric',
      hour:'2-digit',
      minute:'2-digit'
    });
  }

  function statusLabel(status) {
    return String(status || '')
      .split('_')
      .map(v => v.charAt(0).toUpperCase() + v.slice(1))
      .join(' ');
  }

  async function loadResumeBlob(id) {
    if (currentResumeBlobUrl) {
      URL.revokeObjectURL(currentResumeBlobUrl);
      currentResumeBlobUrl = "";
    }

    const headers = new Headers();
    headers.set("Accept", "application/pdf");
    headers.set("X-Requested-With", "XMLHttpRequest");

    if (state.fingerprint) {
      headers.set("x-device-fingerprint", state.fingerprint);
    }

    const res = await fetch(
      CONFIG.API_BASE + "/careers/" + encodeURIComponent(id) + "/resume",
      {
        method: "GET",
        headers,
        credentials: "include",
        cache: "no-store"
      }
    );

    if (res.status === 401 || res.status === 403) {
      throw Object.assign(new Error("Session expired."), { status: res.status });
    }

    if (!res.ok) {
      throw new Error("Failed to load resume");
    }

    const blob = await res.blob();
    currentResumeBlobUrl = URL.createObjectURL(blob);
    return currentResumeBlobUrl;
  }

  function renderTable() {
    if (!state.items.length) {
      els.tbody.innerHTML = '<tr><td colspan="7" class="empty">No career applications found.</td></tr>';
      return;
    }

    els.tbody.innerHTML = state.items.map((item, index) => {
      const id = escapeHtml(item._id || '');
      const status = ALLOWED_STATUS.has(item.status) ? item.status : 'processing';

      return `
        <tr>
          <td>
            <strong>${escapeHtml(item.name)}</strong><br>
            <span class="muted">${escapeHtml(item.trackingId || '-')}</span>
          </td>
          <td>${escapeHtml(item.mobile || '-')}</td>
          <td>${escapeHtml(item.applyingDesignation || '-')}</td>
          <td>${escapeHtml([item.area, item.city, item.state].filter(Boolean).join(', ') || '-')}</td>
          <td><span class="badge ${escapeHtml(status)}">${escapeHtml(statusLabel(status))}</span></td>
          <td>${escapeHtml(formatDate(item.createdAt))}</td>
          <td><button class="btn btn-primary" data-view-index="${index}" data-id="${id}">View</button></td>
        </tr>
      `;
    }).join('');
  }

  function updatePagination() {
    els.pageInfo.textContent = `Page ${state.page} of ${state.pages || 1} • Total ${state.total}`;
    els.prevBtn.disabled = state.page <= 1 || state.busy;
    els.nextBtn.disabled = state.page >= state.pages || state.busy;
  }

  async function loadApplications() {
    if (state.busy) return;
    state.busy = true;
    clearBanner();
    updatePagination();

    try {
      const params = new URLSearchParams();
      params.set('page', String(state.page));
      params.set('limit', String(state.limit));

      const q = els.searchInput.value.trim();
      const status = els.statusFilter.value.trim();
      const designation = els.designationFilter.value.trim();

      if (q) params.set('q', q);
      if (status) params.set('status', status);
      if (designation) params.set('designation', designation);

      const data = await apiFetch('/careers?' + params.toString(), { method: 'GET' });

      state.items = Array.isArray(data?.data?.items) ? data.data.items : [];
      state.total = Number(data?.data?.total || 0);
      state.pages = Math.max(1, Number(data?.data?.pages || 1));

      renderTable();
    } catch (err) {
      if (err.status === 401 || err.status === 403) {
        showBanner('error', 'Session expired. Redirecting to login...');
        setTimeout(redirectToLogin, 600);
        return;
      }

      els.tbody.innerHTML = '<tr><td colspan="7" class="empty">Failed to load applications.</td></tr>';
      showBanner('error', err.message || 'Failed to load applications.');
    } finally {
      state.busy = false;
      updatePagination();
    }
  }

  function detailBlock(label, value) {
    return `
      <div class="detail">
        <strong>${escapeHtml(label)}</strong>
        <span>${escapeHtml(value || '-')}</span>
      </div>
    `;
  }

  function openCandidate(index) {
    const item = state.items[index];
    if (!item) return;

    state.selected = item;

    els.modalTitle.textContent = item.name || 'Candidate Details';
    els.modalSub.textContent = item.trackingId || '';
    els.newStatus.value = ALLOWED_STATUS.has(item.status) ? item.status : 'processing';
    els.adminNote.value = item.adminNote || '';

    els.candidateDetails.innerHTML = [
      detailBlock('Name', item.name),
      detailBlock('Mobile', item.mobile),
      detailBlock('Email', item.email),
      detailBlock('Qualification', item.qualification),
      detailBlock('Designation', item.applyingDesignation),
      detailBlock('State', item.state),
      detailBlock('City', item.city),
      detailBlock('Area', item.area),
      detailBlock('Status', statusLabel(item.status)),
      detailBlock('Submitted At', formatDate(item.createdAt)),
      detailBlock('Resume File', item.resume?.fileName),
      detailBlock('Resume Size', item.resume?.sizeBytes ? Math.round(Number(item.resume.sizeBytes) / 1024) + ' KB' : '-')
    ].join('');

    els.resumeFrame.removeAttribute("src");
    els.resumeOpenBtn.removeAttribute("href");
    els.resumeOpenBtn.style.display = "none";

    loadResumeBlob(item._id)
      .then((blobUrl) => {
        els.resumeFrame.src = blobUrl;
        els.resumeOpenBtn.href = blobUrl;
        els.resumeOpenBtn.style.display = "inline-flex";
      })
      .catch((err) => {
        els.resumeFrame.removeAttribute("src");
        els.resumeOpenBtn.removeAttribute("href");
        els.resumeOpenBtn.style.display = "none";

        if (err.status === 401 || err.status === 403) {
          showBanner("error", "Session expired. Redirecting to login...");
          setTimeout(redirectToLogin, 600);
          return;
        }

        showBanner("error", "Resume could not be loaded.");
      });

    els.modal.classList.add('show');
  }

  function closeModal() {
    els.modal.classList.remove("show");
    state.selected = null;
    els.resumeFrame.removeAttribute("src");
    els.resumeOpenBtn.removeAttribute("href");
    els.resumeOpenBtn.style.display = "none";

    if (currentResumeBlobUrl) {
      URL.revokeObjectURL(currentResumeBlobUrl);
      currentResumeBlobUrl = "";
    }
  }

  async function updateStatus() {
    if (!state.selected?._id || state.busy) return;

    const status = els.newStatus.value.trim();
    const adminNote = els.adminNote.value.trim();

    if (!ALLOWED_STATUS.has(status)) {
      showBanner('error', 'Invalid status selected.');
      return;
    }

    if (status === 'better_luck_next_time' && !adminNote) {
      showBanner('error', 'Admin note is recommended for Better Luck Next Time.');
      return;
    }

    state.busy = true;
    els.updateStatusBtn.disabled = true;
    els.updateStatusBtn.textContent = 'Updating...';

    try {
      await apiFetch('/careers/' + encodeURIComponent(state.selected._id) + '/status', {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json',
          'x-csrf-token': getCookie('csrf_token')
        },
        body: JSON.stringify({ status, adminNote })
      });

      closeModal();
      showBanner('success', 'Career status updated successfully.');
      await loadApplications();
    } catch (err) {
      if (err.status === 401 || err.status === 403) {
        showBanner('error', 'Session expired. Redirecting to login...');
        setTimeout(redirectToLogin, 600);
        return;
      }

      showBanner('error', err.message || 'Failed to update status.');
    } finally {
      state.busy = false;
      els.updateStatusBtn.disabled = false;
      els.updateStatusBtn.textContent = 'Update Status';
      updatePagination();
    }
  }

  function bindEvents() {
    els.refreshBtn.addEventListener('click', loadApplications);

    els.applyFilterBtn.addEventListener('click', function () {
      state.page = 1;
      loadApplications();
    });

    els.searchInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        state.page = 1;
        loadApplications();
      }
    });

    els.designationFilter.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        state.page = 1;
        loadApplications();
      }
    });

    els.prevBtn.addEventListener('click', function () {
      if (state.page > 1) {
        state.page -= 1;
        loadApplications();
      }
    });

    els.nextBtn.addEventListener('click', function () {
      if (state.page < state.pages) {
        state.page += 1;
        loadApplications();
      }
    });

    els.tbody.addEventListener('click', function (e) {
      const btn = e.target.closest('[data-view-index]');
      if (!btn) return;
      openCandidate(Number(btn.dataset.viewIndex));
    });

    els.closeModalBtn.addEventListener('click', closeModal);

    els.modal.addEventListener('click', function (e) {
      if (e.target === els.modal) closeModal();
    });

    els.updateStatusBtn.addEventListener('click', updateStatus);
  }

  async function bootstrap() {
    state.fingerprint = await getStableFingerprint();
    bindEvents();
    await loadApplications();
  }

  bootstrap();
})();
</script>
</body>
</html>
