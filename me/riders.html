<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Revstore ME Riders</title>
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <style>
    :root{--bg1:#4318b8;--bg2:#7e22ce;--bg3:#c026d3;--card:rgba(255,255,255,.96);--text:#1e1b4b;--muted:#6b7280;--line:rgba(30,27,75,.12);--shadow:0 18px 60px rgba(49,12,120,.24);--radius:22px}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:18px;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3))}
    .app{max-width:1180px;margin:0 auto;display:grid;gap:16px}
    .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;color:#fff}
    h1{margin:0;font-size:1.8rem;font-weight:900}.sub{margin:7px 0 0;color:rgba(255,255,255,.86)}
    .actions{display:flex;gap:10px;flex-wrap:wrap}
    .btn{height:46px;min-height:46px;padding:0 16px;border-radius:15px;border:1px solid var(--line);background:#fff;color:var(--text);font-weight:850;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;line-height:1;white-space:nowrap}
    .btn-primary{border:0;color:#fff;background:linear-gradient(135deg,#5b21b6,#7c3aed,#a21caf)}
    .btn:disabled{opacity:.65;cursor:not-allowed}
    .panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
    .toolbar{display:grid;grid-template-columns:minmax(320px,1fr) 220px;gap:10px;margin-bottom:14px}
    input,select,textarea{width:100%;height:48px;border:1px solid var(--line);border-radius:15px;padding:0 14px;font:inherit;outline:none;background:#fff;color:var(--text)}
    textarea{height:80px;padding-top:12px;resize:vertical}
    input:focus,select:focus,textarea:focus{box-shadow:0 0 0 4px rgba(91,33,182,.14);border-color:#7c3aed}
    .banner{display:none;padding:13px 14px;border-radius:15px;margin-bottom:14px;line-height:1.5}
    .banner.show{display:block}.banner.error{background:rgba(239,68,68,.12);color:#7f1d1d}.banner.success{background:rgba(16,185,129,.12);color:#065f46}.banner.info{background:rgba(59,130,246,.12);color:#1e3a8a}
    .list{display:grid;gap:14px}
    .card{border:1px solid var(--line);border-radius:22px;background:#fff;padding:16px;display:grid;gap:13px}
    .card-top{display:grid;grid-template-columns:84px 1fr 1.2fr;gap:16px;align-items:start}
    .avatar{width:84px;height:84px;border-radius:14px;background:#111827;object-fit:cover;border:1px solid var(--line)}
    .name{font-size:1.35rem;font-weight:900;margin:0;line-height:1.15}
    .shop{margin:6px 0 0;color:var(--muted);font-size:1rem}
    .wallet{margin:8px 0 0;color:#6d28d9;font-weight:900}
    .info-title{font-weight:900;margin:0 0 5px}
    .info-text{color:#4b5563;line-height:1.45;word-break:break-word}
    .chips{display:flex;gap:10px;flex-wrap:wrap}
    .chip{display:inline-flex;align-items:center;min-height:34px;padding:6px 12px;border-radius:999px;font-weight:850;font-size:.86rem}
    .chip-online,.chip-active{background:rgba(16,185,129,.14);color:#065f46;border:1px solid rgba(16,185,129,.25)}
    .chip-busy{background:rgba(245,158,11,.18);color:#92400e;border:1px solid rgba(245,158,11,.28)}
    .chip-offline,.chip-inactive{background:rgba(55,65,81,.14);color:#374151;border:1px solid rgba(55,65,81,.25)}
    .chip-deleted{background:rgba(239,68,68,.14);color:#991b1b;border:1px solid rgba(239,68,68,.25)}
    .card-actions{display:flex;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
    .icon-btn{min-width:44px;height:42px;border-radius:13px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:1.1rem;font-weight:900}
    .empty,.loading{text-align:center;padding:32px;color:var(--muted);border:1px dashed var(--line);border-radius:20px;background:#fff}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.48);display:none;place-items:center;padding:16px;z-index:20}
    .modal.show{display:grid}
    .modal-card{width:100%;max-width:820px;max-height:92vh;overflow:auto;background:#fff;border-radius:24px;padding:20px;box-shadow:var(--shadow)}
    .modal-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}
    .modal-head h2{margin:0}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
    .field{display:grid;gap:7px}
    label{font-weight:850;font-size:.9rem}
    .full{grid-column:1/-1}
    .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
    @media(max-width:760px){.topbar{flex-direction:column}.toolbar{grid-template-columns:1fr}.card-top{grid-template-columns:72px 1fr}.avatar{width:72px;height:72px}.card-top .right{grid-column:1/-1}.form-grid{grid-template-columns:1fr}}
  </style>
</head>

<body>
<main class="app">
  <header class="topbar">
    <div>
      <h1>Riders</h1>
      <p class="sub">Rider accounts added under your Marketing Executive profile.</p>
    </div>
    <div class="actions">
      <button id="backBtn" class="btn">Dashboard</button>
      <button id="refreshBtn" class="btn btn-primary">Refresh</button>
      <button id="addBtn" class="btn btn-primary">+ Add Rider</button>
    </div>
  </header>

  <section class="panel">
    <div id="banner" class="banner"></div>

    <div class="toolbar">
      <input id="searchInput" type="search" placeholder="Search rider name, email, mobile, city, area..." autocomplete="off" />
      <select id="statusFilter">
        <option value="all">All</option>
        <option value="online">Online</option>
        <option value="busy">Busy</option>
        <option value="offline">Offline</option>
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
        <option value="deleted">Deleted</option>
      </select>
    </div>

    <div id="loading" class="loading">Loading riders...</div>
    <div id="empty" class="empty" style="display:none;">No riders found.</div>
    <div id="list" class="list"></div>
  </section>
</main>

<section id="riderModal" class="modal" aria-hidden="true">
  <div class="modal-card">
    <div class="modal-head">
      <h2 id="modalTitle">Add Rider</h2>
      <button id="closeModalBtn" class="btn">Close</button>
    </div>

    <form id="riderForm">
      <input type="hidden" id="riderId" />

      <div class="form-grid">
        <div class="field"><label>Name *</label><input id="name" maxlength="120" required /></div>
        <div class="field"><label>Email *</label><input id="email" type="email" maxlength="190" required /></div>
        <div class="field"><label>Mobile *</label><input id="mobile" inputmode="numeric" maxlength="15" required /></div>
        <div class="field"><label>Password <span id="passwordHint">(required for add)</span></label><input id="password" type="password" minlength="8" maxlength="128" /></div>

        <div class="field"><label>Status</label><select id="status"><option value="offline">Offline</option><option value="online">Online</option><option value="busy">Busy</option></select></div>
        <div class="field"><label>Active</label><select id="isActive"><option value="true">Active</option><option value="false">Inactive</option></select></div>

        <div class="field"><label>Image URL / Path</label><input id="image" /></div>
        <div class="field"><label>PIN</label><input id="pin" inputmode="numeric" maxlength="6" /></div>

        <div class="field full"><label>Address</label><textarea id="address"></textarea></div>
        <div class="field"><label>Address 2</label><input id="address2" /></div>
        <div class="field"><label>Address 3</label><input id="address3" /></div>
        <div class="field"><label>City</label><input id="city" /></div>
        <div class="field"><label>Area</label><input id="area" /></div>
        <div class="field"><label>State</label><input id="state" /></div>
        <div class="field"><label>Country</label><input id="country" value="India" /></div>

        <div class="field"><label>Aadhaar Number</label><input id="aadharNumber" maxlength="12" /></div>
        <div class="field"><label>PAN Number</label><input id="panNumber" maxlength="10" /></div>
        <div class="field"><label>Driving License Number</label><input id="drivingLicenseNumber" /></div>

        <div class="field"><label>Bank Account Number</label><input id="bankAccountNumber" /></div>
        <div class="field"><label>Bank IFSC</label><input id="bankIfsc" maxlength="11" /></div>
        <div class="field"><label>Bank Name</label><input id="bankName" /></div>
        <div class="field"><label>UPI</label><input id="bankUpi" /></div>
      </div>

      <div class="modal-actions">
        <button type="button" id="cancelBtn" class="btn">Cancel</button>
        <button type="submit" id="saveBtn" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</section>

<script>
(function () {
  'use strict';

  const CONFIG = {
    API_BASE: typeof window.ME_WEB_API_BASE === 'string' && window.ME_WEB_API_BASE.trim()
      ? window.ME_WEB_API_BASE.trim().replace(/\/+$/, '')
      : 'https://api.revstore.in/api/marketing-executive-web/v1',
    LOGIN_URL: '/me/login',
    DASHBOARD_URL: '/me/dashboard',
    IMAGE_BASE: 'https://api.revstore.in',
    FINGERPRINT_STORAGE_KEY: 'me_web_fp_v1'
  };

  const $ = id => document.getElementById(id);

  const els = {
    banner:$('banner'),loading:$('loading'),empty:$('empty'),list:$('list'),
    searchInput:$('searchInput'),statusFilter:$('statusFilter'),refreshBtn:$('refreshBtn'),addBtn:$('addBtn'),backBtn:$('backBtn'),
    modal:$('riderModal'),modalTitle:$('modalTitle'),closeModalBtn:$('closeModalBtn'),cancelBtn:$('cancelBtn'),form:$('riderForm'),saveBtn:$('saveBtn'),riderId:$('riderId'),passwordHint:$('passwordHint'),
    name:$('name'),email:$('email'),mobile:$('mobile'),password:$('password'),status:$('status'),isActive:$('isActive'),image:$('image'),
    address:$('address'),address2:$('address2'),address3:$('address3'),city:$('city'),area:$('area'),state:$('state'),country:$('country'),pin:$('pin'),
    aadharNumber:$('aadharNumber'),panNumber:$('panNumber'),drivingLicenseNumber:$('drivingLicenseNumber'),
    bankAccountNumber:$('bankAccountNumber'),bankIfsc:$('bankIfsc'),bankName:$('bankName'),bankUpi:$('bankUpi')
  };

  const state = { fingerprint:'', riders:[], busy:false };

  function showBanner(type,msg){els.banner.className='banner show '+type;els.banner.textContent=msg||''}
  function clearBanner(){els.banner.className='banner';els.banner.textContent=''}
  function getCookie(name){const t=String(name||'')+'=';const f=String(document.cookie||'').split(';').map(v=>v.trim()).find(v=>v.indexOf(t)===0);return f?decodeURIComponent(f.slice(t.length)):''}

  async function sha256Hex(input){
    const d=new TextEncoder().encode(String(input));
    const h=await crypto.subtle.digest('SHA-256',d);
    return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }

  async function getStableFingerprint(){
    try{
      const e=localStorage.getItem(CONFIG.FINGERPRINT_STORAGE_KEY);
      if(e&&e.trim())return e.trim().slice(0,200);
    }catch(_){}

    const raw=[
      navigator.userAgent||'',
      navigator.language||'',
      screen.width||'',
      screen.height||'',
      screen.colorDepth||'',
      Intl.DateTimeFormat().resolvedOptions().timeZone||'',
      navigator.platform||'',
      crypto.getRandomValues(new Uint32Array(4)).join('-')
    ].join('|');

    const fp=(await sha256Hex(raw)).slice(0,64);

    try{
      localStorage.setItem(CONFIG.FINGERPRINT_STORAGE_KEY,fp);
    }catch(_){}

    return fp;
  }

  function redirectToLogin(){
    window.location.replace(CONFIG.LOGIN_URL);
  }

  async function apiFetch(path, options){
    const headers=new Headers((options&&options.headers)||{});
    headers.set('Accept','application/json');
    headers.set('X-Requested-With','XMLHttpRequest');

    if(state.fingerprint){
      headers.set('x-device-fingerprint',state.fingerprint);
    }

    const method=String((options&&options.method)||'GET').toUpperCase();
    const body=options&&options.body;

    if(body && !(body instanceof FormData) && !headers.has('Content-Type')){
      headers.set('Content-Type','application/json');
    }

    if(!['GET','HEAD','OPTIONS'].includes(method)){
      headers.set('x-csrf-token',getCookie('csrf_token')||'');
    }

    const res=await fetch(CONFIG.API_BASE+path,{
      ...(options||{}),
      headers,
      credentials:'include',
      cache:'no-store',
      redirect:'follow',
      referrerPolicy:'strict-origin-when-cross-origin'
    });

    let data={};

    try{
      data=await res.json();
    }catch(_){}

    if(res.status===401||res.status===403){
      throw Object.assign(new Error(data.message||'Session expired.'),{status:res.status,data});
    }

    if(!res.ok){
      throw Object.assign(new Error(data.message||'Request failed.'),{status:res.status,data});
    }

    return data;
  }

  function escapeHtml(v){
    return String(v==null?'':v)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#39;');
  }

  function moneyPaise(v){
    const n=Number(v||0);
    return '₹'+(Number.isFinite(n)?(n/100).toFixed(2):'0.00');
  }

  function imageUrl(r){
    const raw=String(r.image||r.profileImage||'').trim();
    if(!raw)return '';
    if(/^https?:\/\//i.test(raw))return raw;
    return CONFIG.IMAGE_BASE+(raw.startsWith('/')?raw:'/'+raw);
  }

  function statusOf(r){
    const s=String(r.status||'').toLowerCase();
    return ['online','busy','offline'].includes(s)?s:'offline';
  }

  function locationText(r){
    const c=r&&r.location&&Array.isArray(r.location.coordinates)?r.location.coordinates:[];
    return c.length===2?'Lat: '+c[1]+', Lng: '+c[0]:'Location not set';
  }

  function addressText(r){
    const p=[r.address,r.address2,r.address3,r.area,r.city,r.state,r.pin,r.country].filter(Boolean);
    return p.length?p.join(', '):'Address not added';
  }

  function zoneName(z){
    if(!z)return '';
    if(typeof z==='string')return z;
    return z.name||z._id||'';
  }

  function searchBlob(r){
    return [r.name,r.email,r.mobile,r.status,r.city,r.area,r.state,r.pin,zoneName(r.assignedZone),zoneName(r.activeZone)]
      .filter(Boolean)
      .join(' ')
      .toLowerCase();
  }

  function render(){
    const q=String(els.searchInput.value||'').trim().toLowerCase();
    const filter=String(els.statusFilter.value||'all');
    let rows=state.riders.slice();

    if(q)rows=rows.filter(r=>searchBlob(r).includes(q));
    if(filter==='online')rows=rows.filter(r=>statusOf(r)==='online');
    if(filter==='busy')rows=rows.filter(r=>statusOf(r)==='busy');
    if(filter==='offline')rows=rows.filter(r=>statusOf(r)==='offline');
    if(filter==='active')rows=rows.filter(r=>r.isActive===true&&r.isDeleted!==true);
    if(filter==='inactive')rows=rows.filter(r=>r.isActive===false&&r.isDeleted!==true);
    if(filter==='deleted')rows=rows.filter(r=>r.isDeleted===true);

    els.empty.style.display=rows.length?'none':'block';

    els.list.innerHTML=rows.map(r=>{
      const s=statusOf(r);
      const img=imageUrl(r);
      const deleted=r.isDeleted===true;
      const walletBalance=r.balance!=null?r.balance:(r.wallet&&r.wallet.balance)||0;

      return `
        <article class="card">
          <div class="card-top">
            ${img?`<img class="avatar" src="${escapeHtml(img)}" alt="">`:`<div class="avatar"></div>`}
            <div>
              <p class="name">${escapeHtml(r.name||'Unnamed Rider')}</p>
              <p class="shop">${escapeHtml(r.email||'')}</p>
              <p class="shop">${escapeHtml(r.mobile||'')}</p>
              <p class="wallet">Wallet: ${escapeHtml(moneyPaise(walletBalance))}</p>
            </div>
            <div class="right">
              <p class="info-title">Address / Zone</p>
              <div class="info-text">
                ${escapeHtml(addressText(r))}<br>
                ${escapeHtml(locationText(r))}<br>
                Assigned Zone: ${escapeHtml(zoneName(r.assignedZone)||'Not assigned')}<br>
                Active Zone: ${escapeHtml(zoneName(r.activeZone)||'Not detected')}
              </div>
            </div>
          </div>
          <div class="chips">
            <span class="chip chip-${escapeHtml(s)}">${escapeHtml(s.toUpperCase())}</span>
            <span class="chip ${r.isActive?'chip-active':'chip-inactive'}">${escapeHtml(r.isActive?'Active':'Inactive')}</span>
            ${deleted?'<span class="chip chip-deleted">Deleted</span>':''}
          </div>
          <div class="card-actions">
            <button class="icon-btn" data-action="view" data-id="${escapeHtml(r._id)}" title="View">👁️</button>
            ${deleted?`<button class="icon-btn" data-action="restore" data-id="${escapeHtml(r._id)}" title="Restore">♻️</button>`:`<button class="icon-btn" data-action="delete" data-id="${escapeHtml(r._id)}" title="Delete">🗑️</button>`}
            <button class="icon-btn" data-action="wallet" data-id="${escapeHtml(r._id)}" title="Wallet">₹</button>
            <button class="icon-btn" data-action="location" data-id="${escapeHtml(r._id)}" title="Location">📍</button>
          </div>
        </article>`;
    }).join('');
  }

  async function loadRiders(){
    clearBanner();
    els.loading.style.display='block';
    els.empty.style.display='none';
    els.list.innerHTML='';

    try{
      await apiFetch('/auth/me',{method:'GET'});

      const data=await apiFetch('/riders?includeDeleted=true&page=1&limit=100',{method:'GET'});
      state.riders=Array.isArray(data.riders)?data.riders:[];

      render();
    }catch(err){
      if(err.status===401||err.status===403){
        showBanner('error','Session expired. Redirecting to login...');
        setTimeout(redirectToLogin,500);
        return;
      }

      showBanner('error',err.message||'Failed to load riders.');
    }finally{
      els.loading.style.display='none';
    }
  }

  function findRider(id){
    return state.riders.find(r=>String(r._id)===String(id))||null;
  }

  function setFormDisabled(disabled){
    [
      els.name,els.email,els.mobile,els.password,els.status,els.isActive,els.image,
      els.address,els.address2,els.address3,els.city,els.area,els.state,els.country,els.pin,
      els.aadharNumber,els.panNumber,els.drivingLicenseNumber,
      els.bankAccountNumber,els.bankIfsc,els.bankName,els.bankUpi
    ].forEach(el=>{el.disabled=!!disabled});
  }

  function openAddModal(){
    els.form.reset();
    els.riderId.value='';
    els.modalTitle.textContent='Add Rider';

    setFormDisabled(false);

    els.email.disabled=false;
    els.password.required=true;
    els.passwordHint.textContent='(required for add)';
    els.status.value='offline';
    els.isActive.value='true';
    els.country.value='India';
    els.saveBtn.style.display='inline-flex';
    els.modal.classList.add('show');
  }

  async function openViewModal(rider){
    if(!rider)return;

    try{
      const data=await apiFetch('/riders/'+encodeURIComponent(rider._id),{method:'GET'});
      rider=data.rider||rider;
    }catch(_){}

    els.form.reset();
    els.riderId.value=rider._id||'';
    els.modalTitle.textContent='View Rider';
    els.passwordHint.textContent='(hidden)';
    els.password.required=false;
    els.password.value='';

    els.name.value=rider.name||'';
    els.email.value=rider.email||'';
    els.mobile.value=rider.mobile||'';
    els.status.value=statusOf(rider);
    els.isActive.value=rider.isActive===false?'false':'true';
    els.image.value=rider.image||rider.profileImage||'';

    els.address.value=rider.address||'';
    els.address2.value=rider.address2||'';
    els.address3.value=rider.address3||'';
    els.city.value=rider.city||'';
    els.area.value=rider.area||'';
    els.state.value=rider.state||'';
    els.country.value=rider.country||'India';
    els.pin.value=rider.pin||'';

    const docs=rider.documents||{};
    els.aadharNumber.value=(docs.aadhar&&docs.aadhar.number)||'';
    els.panNumber.value=(docs.pan&&docs.pan.number)||'';
    els.drivingLicenseNumber.value=(docs.drivingLicense&&docs.drivingLicense.number)||'';

    const bank=rider.bank||{};
    els.bankAccountNumber.value=bank.accountNumber||'';
    els.bankIfsc.value=bank.ifsc||'';
    els.bankName.value=bank.bankName||bank.name||'';
    els.bankUpi.value=bank.upi||bank.upiId||'';

    setFormDisabled(true);
    els.saveBtn.style.display='none';
    els.modal.classList.add('show');
  }

  function closeModal(){
    els.modal.classList.remove('show');
    els.form.reset();
    els.riderId.value='';
    setFormDisabled(false);
    els.email.disabled=false;
    els.saveBtn.disabled=false;
    els.saveBtn.textContent='Save';
    els.saveBtn.style.display='inline-flex';
  }

  function payloadFromForm(){
    const payload={
      name:els.name.value.trim(),
      email:els.email.value.trim().toLowerCase(),
      mobile:els.mobile.value.trim(),
      password:els.password.value.trim(),
      status:els.status.value.trim(),
      isActive:els.isActive.value==='true',
      image:els.image.value.trim(),
      address:els.address.value.trim(),
      address2:els.address2.value.trim(),
      address3:els.address3.value.trim(),
      city:els.city.value.trim(),
      area:els.area.value.trim(),
      state:els.state.value.trim(),
      country:els.country.value.trim(),
      pin:els.pin.value.trim(),
      aadharNumber:els.aadharNumber.value.trim(),
      panNumber:els.panNumber.value.trim(),
      drivingLicenseNumber:els.drivingLicenseNumber.value.trim(),
      bankAccountNumber:els.bankAccountNumber.value.trim(),
      bankIfsc:els.bankIfsc.value.trim(),
      bankName:els.bankName.value.trim(),
      bankUpi:els.bankUpi.value.trim()
    };

    Object.keys(payload).forEach(k=>{
      if(payload[k]==='')delete payload[k];
    });

    return payload;
  }

  function validatePayload(payload){
    if(!payload.name)throw new Error('Name is required.');
    if(!payload.email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(payload.email))throw new Error('Valid email is required.');
    if(!payload.mobile||!/^[0-9]{7,15}$/.test(payload.mobile))throw new Error('Mobile must be 7 to 15 digits.');
    if(!payload.password||payload.password.length<8)throw new Error('Password must be at least 8 characters.');
    if(payload.pin&&!/^[0-9]{6}$/.test(payload.pin))throw new Error('PIN must be 6 digits.');
  }

  async function saveRider(event){
    event.preventDefault();

    if(state.busy)return;

    const id=els.riderId.value.trim();

    if(id){
      showBanner('error','Marketing Executive rider page is view-only for existing riders.');
      return;
    }

    const payload=payloadFromForm();

    try{
      validatePayload(payload);

      state.busy=true;
      els.saveBtn.disabled=true;
      els.saveBtn.textContent='Saving...';

      await apiFetch('/riders',{method:'POST',body:JSON.stringify(payload)});

      closeModal();
      showBanner('success','Rider added successfully.');
      await loadRiders();
    }catch(err){
      const errors=err.data&&err.data.errors;
      showBanner('error',errors?Object.values(errors).join(' | '):(err.message||'Failed to save rider.'));
    }finally{
      state.busy=false;
      els.saveBtn.disabled=false;
      els.saveBtn.textContent='Save';
    }
  }

  async function deleteRider(id){
    const rider=findRider(id);
    const ok=window.confirm('Delete rider '+((rider&&rider.name)||'')+'?');

    if(!ok)return;

    await apiFetch('/riders/'+encodeURIComponent(id),{method:'DELETE'});
    showBanner('success','Rider deleted successfully.');
    await loadRiders();
  }

  async function restoreRider(id){
    await apiFetch('/riders/'+encodeURIComponent(id)+'/restore',{method:'PUT'});
    showBanner('success','Rider restored successfully.');
    await loadRiders();
  }

  function bindEvents(){
    els.backBtn.addEventListener('click',()=>{
      window.location.href=CONFIG.DASHBOARD_URL;
    });

    els.refreshBtn.addEventListener('click',loadRiders);
    els.addBtn.addEventListener('click',openAddModal);
    els.closeModalBtn.addEventListener('click',closeModal);
    els.cancelBtn.addEventListener('click',closeModal);
    els.form.addEventListener('submit',saveRider);
    els.searchInput.addEventListener('input',render);
    els.statusFilter.addEventListener('change',render);

    els.modal.addEventListener('click',e=>{
      if(e.target===els.modal)closeModal();
    });

    els.list.addEventListener('click',async e=>{
      const btn=e.target.closest('[data-action]');
      if(!btn)return;

      const action=btn.getAttribute('data-action');
      const id=btn.getAttribute('data-id');
      const rider=findRider(id);

      try{
        if(action==='view')await openViewModal(rider);
        if(action==='delete')await deleteRider(id);
        if(action==='restore')await restoreRider(id);
        if(action==='wallet')showBanner('info','Wallet balance is shown in the rider card.');
        if(action==='location')showBanner('info',rider?locationText(rider):'Rider location not found.');
      }catch(err){
        if(err.status===401||err.status===403){
          showBanner('error','Session expired. Redirecting to login...');
          setTimeout(redirectToLogin,500);
          return;
        }

        showBanner('error',err.message||'Action failed.');
      }
    });
  }

  async function bootstrap(){
    state.fingerprint=await getStableFingerprint();
    bindEvents();
    await loadRiders();
  }

  bootstrap().catch(()=>{
    showBanner('error','Failed to initialize Marketing Executive rider page.');
  });
})();
</script>
</body>
</html>
